name: Quality gates

on:
  pull_request:
    branches:
      - dev-extension
      - main
  push:
    branches:
      - dev-extension
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked generated or sensitive files
        run: |
          set -euo pipefail

          violations=()
          while IFS= read -r -d '' path; do
            filename="${path##*/}"

            if [[ "$filename" == ".DS_Store" ]]; then
              violations+=("$path")
            elif [[ "$path" == "package-lock.json" ]]; then
              violations+=("$path")
            elif [[ "$filename" == ".env" || "$filename" == .env.* ]] &&
              [[ "$filename" != *.example ]]; then
              violations+=("$path")
            elif [[ "$path" =~ (^|/)(node_modules|\.next|\.plasmo|coverage|\.pytest_cache|\.ruff_cache|__pycache__)(/|$) ]]; then
              violations+=("$path")
            elif [[ "$path" =~ (^|/)(build|dist)/.*\.(zip|crx)$ ]]; then
              violations+=("$path")
            fi
          done < <(git ls-files -z)

          if (( ${#violations[@]} > 0 )); then
            printf 'Tracked generated or sensitive files are not allowed:\n' >&2
            printf ' - %s\n' "${violations[@]}" >&2
            exit 1
          fi

      - name: Check whitespace integrity
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git diff --check "$BASE_SHA" "$HEAD_SHA"
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                git diff-tree --check --root -r "$CURRENT_SHA"
              else
                git diff --check "$BEFORE_SHA" "$CURRENT_SHA"
              fi
              ;;
            workflow_dispatch)
              git diff --check
              ;;
          esac

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: clara-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          cache-dependency-glob: clara-backend/uv.lock
          enable-cache: true
          version: "0.11.11"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run --frozen ruff check .

      - name: Run backend tests
        run: uv run --frozen pytest -q

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: clara-dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          cache-dependency-path: clara-dashboard/package-lock.json
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run dashboard lint
        run: npm run lint -- --max-warnings 7

      - name: Build dashboard
        run: npm run build

  extension:
    name: Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: clara-extension
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          cache-dependency-path: clara-extension/package-lock.json
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build extension
        run: npm run build

      - name: Verify extension build
        run: test -f build/chrome-mv3-prod/manifest.json

      - name: Package extension
        run: npm run package

      - name: Verify extension package
        run: test -s build/chrome-mv3-prod.zip

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
          fail-on-severity: high
